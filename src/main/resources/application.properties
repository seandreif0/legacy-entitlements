# ENT-SVC runtime settings (profile-specific JDBC settings in application-local/-prod.properties)
spring.profiles.default=local

ent.jdbc.user=ENT_APP

spring.datasource.driver-class-name=${ent.jdbc.driver}
spring.datasource.url=${ent.jdbc.url}
spring.datasource.username=${ent.jdbc.user}
spring.datasource.password=${ent.jdbc.password}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.auto-commit=true

# schema/seed scripts are local only. DBA owns the real schema
spring.sql.init.mode=never

# drop location for the HR feed (HRIS -> SFTP -> here)
ent.extract.dir=/data/feeds/hr
ent.extract.prefix=HR_USERS_
# days
ent.extract.maxAgeDays=3

# 02:15 server time
ent.batch.cron=0 15 2 * * *

# single-threaded nightly scheduler (was task:scheduler entScheduler pool-size=1)
spring.task.scheduling.pool.size=1
spring.task.scheduling.thread-name-prefix=entScheduler-
